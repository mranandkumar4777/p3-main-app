name: Build Android remote app (APK)

on:
  push:
    tags: ['v*']
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Create the Android project
        run: npx cap add android
      - name: Allow http:// to the computer and the camera (QR scan)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application android:usesCleartextTraffic="true"#' "$M"
          grep -n "CAMERA\|usesCleartext" "$M"
      - name: Sync web files
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PresenterRemote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PresenterRemote-apk
          path: mobile/PresenterRemote.apk
      - name: Publish the mobile-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mobile-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create mobile-latest PresenterRemote.apk --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Android remote (latest)" --notes "Latest Presenter Remote APK"
