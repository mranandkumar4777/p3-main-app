name: Android Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Clean & Prepare Mobile Folder
        run: |
          cd mobile
          rm -rf node_modules android www capacitor.config.* package-lock.json
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p www
          cp remote.html www/index.html || echo "index.html created" > www/index.html
          npx cap init "Presenter Remote" "com.presenter.remote" --web-dir www

      - name: Add Android Platform & Sync
        run: |
          cd mobile
          npx cap add android
          npx cap sync android

      - name: Build Android APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PresenterRemote-APK
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
